apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "report-api.name" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "RedisConfigurationString": "{{ .Values.connectionStrings.redis }}"
      },
      "NatsSetting": {
        "Urls": "{{ .Values.nats.urls }}"
      },
      "Report": {
        "GameProvidersPluggableBaseUrl": "http://game-pluggable-service"
      }
    }
