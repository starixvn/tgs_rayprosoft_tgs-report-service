apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "report-api.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}",
        "RedisConfigurationString": "{{ .Values.connectionStrings.redis }}"
      },
      "NatsSetting": {
        "Urls": "{{ .Values.nats.urls }}"
      }
    }
